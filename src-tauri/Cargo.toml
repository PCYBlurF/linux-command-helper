[package]
name = "linux-command-helper"
version = "1.0.0"
description = "Linux 指令速查助手 —— 离线 Linux 命令速查桌面应用"
authors = ["LinuxCommandHelper"]
edition = "2021"

[lib]
name = "linux_command_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
